<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testAPI()">Test Yearly Expense Chart API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            try {
                // 测试API调用
                const response = await fetch('http://localhost:8000/api/v1/bills/yearly-expense-chart?year=2025', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // 注意：这里没有token，可能会返回401，但至少能看到API是否存在
                    }
                });
                
                const data = await response.text();
                resultDiv.innerHTML = `<h3>Response Status: ${response.status}</h3><pre>${data}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
